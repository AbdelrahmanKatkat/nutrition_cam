name = "nutrisnap-proxy"
main = "src/index.js"
compatibility_date = "2025-01-01"

[vars]
# Comma-separated list of sites allowed to call the proxy. EDIT THE GITHUB PAGES ORIGIN.
# (An origin is scheme + host only: no path and no trailing slash.)
ALLOWED_ORIGINS = "https://abdelrahmankatkat.github.io"
# true = also accept http://localhost and http://127.0.0.1 on any port (for testing on your PC).
# Set to "false" before a public launch.
ALLOW_LOCALHOST = "false"
# gemini-2.5-* is only served to accounts that already used it (new keys get 404). Alternative: "gemini-3.8-flash" (more accurate, costlier).
GEMINI_MODEL = "gemini-3.5-flash-lite"
# Used once if the main model stays busy (503) after retries.
GEMINI_FALLBACK_MODEL = "gemini-3.8-flash"

# Per-client throttle in front of Gemini (needs wrangler >= 4.36). period must be 10 or 60.
# Counters are per Cloudflare location and approximate – a guard, not exact accounting.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 10
  period = 60

# Scan counter: one data point per successful scan (outcome only). Query it in the Cloudflare dashboard.
[[analytics_engine_datasets]]
binding = "SCANS"
dataset = "nutrisnap_scans"

# The API key is NOT here. Set it as a secret:  npx wrangler secret put GEMINI_API_KEY
